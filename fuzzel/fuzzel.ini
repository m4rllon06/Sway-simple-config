# ~/.config/fuzzel/fuzzel.ini — desce da barra, estilo dmenu

[main]
font=Iosevka Nerd Font:size=11
terminal=foot
prompt="run "
icons-enabled=no
match-mode=fzf
show-actions=no
anchor=top
y-margin=4
width=48
lines=12
horizontal-pad=10
vertical-pad=6
inner-pad=4
line-height=18
letter-spacing=0
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=111111f2
text=8a8a8aff
prompt=8a9aabff
placeholder=6a6a6aff
input=c8c8c8ff
match=c8c8c8ff
selection=1f1f1fff
selection-text=c8c8c8ff
selection-match=8a9aabff
counter=6a6a6aff
border=2a2a2aff

[border]
width=1
radius=0
selection-radius=0
